# GPT-2 small, residual stream entering block 7. columns = decoder columns, l0 = active columns per token.
model_name: gpt2
hook_name: blocks.7.hook_resid_pre
d_in: 768
dataset_path: apollo-research/Skylion007-openwebtext-tokenizer-gpt2
is_dataset_tokenized: true
context_size: 128
train_batch_size_tokens: 4096
training_tokens: 300000000
seed: 42
dtype: float32
activation_cache: gpt2_l7_300m
adam_beta1: 0.9
adam_beta2: 0.999
lr_decay_fraction: 0.2
dead_feature_window: 1000
store_batch_size_prompts: 16

# training settings shared by the SAEs of each method
methods:
  # SASA of the matched grid
  sasa:
    architecture: topk_sasa
    gate: topk
    lr: 4.0e-4
    lr_warm_up_steps: 1000
    n_batches_in_buffer: 128
    normalize_activations: layer_norm
    apply_b_dec_to_input: false
    encoder_norm_renorm: false
    k_aux: 384
    aux_coefficient: 1.0
    dead_feature_window: 100
    nuclear_coefficient: 0.0
    nuclear_target: composition
    n_checkpoints: 2
  # SASA compared with Bloom's pretrained GPT-2 SAE
  sasa_topk:
    architecture: topk_sasa
    gate: topk
    lr: 2.0e-4
    lr_warm_up_steps: 1000
    n_batches_in_buffer: 128
    training_tokens: 150000000
    normalize_activations: layer_norm
    apply_b_dec_to_input: true
    encoder_norm_renorm: true
    k_aux: 384
    aux_coefficient: 1.0
    nuclear_coefficient: 100.0
    nuclear_target: decoder
    n_checkpoints: 0
  # vector baselines
  topk:
    architecture: topk
    lr: 4.0e-4
    lr_warm_up_steps: 0
    n_batches_in_buffer: 64
    normalize_activations: none
    apply_b_dec_to_input: true
    aux_loss_coefficient: 1.0
    rescale_acts_by_decoder_norm: true
    n_checkpoints: 1
  batchtopk:
    architecture: batchtopk
    lr: 4.0e-4
    lr_warm_up_steps: 0
    n_batches_in_buffer: 64
    normalize_activations: none
    apply_b_dec_to_input: true
    aux_loss_coefficient: 1.0
    rescale_acts_by_decoder_norm: true
    topk_threshold_lr: 0.01
    n_checkpoints: 1
  matryoshka:
    architecture: matryoshka_batchtopk
    lr: 4.0e-4
    lr_warm_up_steps: 0
    n_batches_in_buffer: 64
    normalize_activations: none
    apply_b_dec_to_input: true
    aux_loss_coefficient: 1.0
    rescale_acts_by_decoder_norm: true
    topk_threshold_lr: 0.01
    n_checkpoints: 1

saes:
