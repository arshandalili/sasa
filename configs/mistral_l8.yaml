# Mistral-7B, residual stream entering block 8; the activations are computed during training.
model_name: mistralai/Mistral-7B-v0.1
hook_name: blocks.8.hook_resid_pre
d_in: 4096
dataset_path: monology/pile-uncopyrighted
is_dataset_tokenized: false
context_size: 512
train_batch_size_tokens: 4096
training_tokens: 500000000
seed: 42
dtype: bfloat16
activation_cache: null
adam_beta1: 0.9
adam_beta2: 0.999
lr_decay_fraction: 0.2
dead_feature_window: 1000
store_batch_size_prompts: 16

# training settings shared by the SAEs of each method
methods:
  sasa:
    architecture: batchtopk_manifold_sae
    gate: batchtopk
    lr: 2.0e-4
    lr_warm_up_steps: 1000
    n_batches_in_buffer: 128
    normalize_activations: layer_norm
    apply_b_dec_to_input: false
    encoder_norm_renorm: false
    k_aux: 256
    aux_coefficient: 1.0
    nuclear_coefficient: 0.0
    nuclear_target: composition
    n_checkpoints: 10

saes:
  sasa_r8_k10: {method: sasa, rank: 8, columns: 32768, l0: 80}
